const reqOpts=()=>[['','— none —'],...S.req.filter(r=>PJ==='all'||r.proj===PJ).map(r=>[r.id,r.title+(S.proj.length>1?' ('+pn(r.proj)+')':'')])],relOpts=()=>[['','— none —'],...S.rel.filter(r=>PJ==='all'||r.proj===PJ).map(r=>[r.id,r.ver+(S.proj.length>1?' ('+pn(r.proj)+')':'')])];

{k:'proj',l:'Project',t:'sel',o:projOpts(),d:dp()},{k:'title',l:'Title'},{k:'problem',l:'Problem statement',t:'area'},{k:'story',l:'User story',t:'area'},{k:'ac',l:'Acceptance criteria',t:'area'},

function logForm(id){const r=S.rel.find(x=>x.id===id);form('Go/no-go decision',[{k:'dec',l:'Decision',t:'sel',o:['Go','No-go']},{k:'note',l:'Rationale',t:'area'},{k:'by',l:'Decided by'}],{},

{k:'rel',l:'Linked release',t:'sel',o:relOpts()},{k:'date',l:'Review date',t:'date',d:today()}],x,o=>x?Object.assign(x,o):S.met.push({id:uid(),...o}),x&&(()=>S.met=S.met.filter(m=>m.id!==id)))}
const RULES={Performance:/slow|timeout|time out|lag|crash|loading|minutes/i,Bug:/bug|error|broken|fails?|doesn.t work|cannot|can.t/i,'Missing feature':/wish|missing|need|should|would like|no way|bulk/i,Pricing:/price|pricing|expensive|cost|plan/i,Onboarding:/onboard|setup|getting started|tutorial/i,Integration:/integrat|api|zapier|slack|sync/i,Usability:/confus|hard to|unclear|navigate|find/i};
const NEG=/slow|broken|bug|error|can.t|cannot|confus|hard|fail|annoy|frustrat|expensive|missing|timeout|crash|hate|worse/i,POS=/love|great|helpful|easy|fast|thanks|excellent|amazing|like/i;
function tag(t){let th='Usability';for(const k in RULES)if(RULES[k].test(t)){th=k;break}const sen=NEG.test(t)?'neg':POS.test(t)?'pos':'neu';return{th,sen,sev:sen==='neg'?(/blocking|can.t|cannot|crash|lost|urgent/i.test(t)?'High':'Medium'):'Low'}}

function autolink(q){const w=s=>new Set(String(s).toLowerCase().match(/[a-z]{4,}/g)||[]);let n=0;S.fb.forEach(f=>{if(f.req)return;const fw=w(f.text);let b=null,bs=1;S.req.forEach(r=>{if(r.proj!==f.proj)return;const rw=w(r.title+' '+r.problem);let c=0;fw.forEach(x=>{if(rw.has(x))c++});if(c>bs){bs=c;b=r}});if(b){f.req=b.id;n++}});save();if(!q){render();toast(n+' linked. Review in the table.')}}
function nudges(){const n=[],u=S.fb.filter(f=>!f.req).length,ov=S.fb.filter(od).length;if(ov)n.push(ov+' action point(s) are overdue.');if(u)n.push(`${u} action point(s) not linked to a requirement. Try Auto-link on the Action points tab.`);S.req.forEach(r=>{if(r.status==='Discovery'&&cnt(r.id)>=3)n.push(`${esc(r.title)} has ${cnt(r.id)} linked action points but is still in Discovery.`);if(r.status!=='Shipped'&&!r.rel&&score(r)>=50)n.push(`${esc(r.title)} scores ${score(r)} but is not in a release.`);if(r.status!=='Shipped'&&cnt(r.id)===0)n.push(`${esc(r.title)} has no linked action points behind it.`)});S.rel.forEach(r=>{if(r.status!=='Released'&&r.date<today()&&ready(r)<100)n.push(`Release ${esc(r.ver)} is past its target date at ${ready(r)}% ready.`)});S.met.forEach(m=>{const r=S.rel.find(x=>x.id===m.rel);if(r&&r.status==='Released'&&prog(m)<100&&m.date<today())n.push(`${esc(m.name)} is below target after release.`)});return n}
function notes(id){const r=S.rel.find(x=>x.id===id),sc=S.req.filter(q=>q.rel===id);const t=`Release ${r.ver} (${r.date})\n\nWhat is new\n`+(sc.map(q=>`- ${q.title}: ${q.problem} (${cnt(q.id)} linked action point${cnt(q.id)==1?'':'s'})`).join('\n')||'- No scoped items')+`\n\nReadiness: ${ready(r)}%`+(r.log.length?`\nLatest decision: ${r.log[r.log.length-1].dec}`:'');const m=document.getElementById('modal');m.innerHTML=`<form><h2>Release notes ${esc(r.ver)}</h2><textarea style="min-height:220px">${esc(t)}</textarea><div class="acts"><button type="button" class="p" id="cx">Close</button></div></form>`;m.style.display='flex';m.querySelector('#cx').onclick=()=>m.style.display='none'}
const AS=['Open','In progress','Done'];let fbf='All';
const od=f=>f.due&&(f.status||'Open')!=='Done'&&f.due<today();

const BUL=/^\s*(?:[-*•–—▪◦]+|\d+[.)])\s+/,CHK=/^(?:\[([ xX]?)\]|☐|☑|✅|✔)\s*/,HD=/^(?:action points?|action items?|actions|next steps|to-?do(?: list)?|agenda|attendees|minutes|notes)\s*:?$/i;
const MO=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'],WD=['sun','mon','tue','wed','thu','fri','sat'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function parseAP(txt){const L=txt.split(/\r?\n/),anyB=L.some(l=>BUL.test(l)),out=[];L.forEach(raw=>{if(!raw.trim())return;const isB=BUL.test(raw);let l=raw.replace(BUL,'').trim(),done=false;const c=l.match(CHK);if(c){done=/[xX]|☑|✅|✔/.test(c[0]);l=l.slice(c[0].length).trim()}if(!l||HD.test(l)||(/:$/.test(l)&&l.length<60))return;if(anyB&&!isB&&out.length&&/^\s/.test(raw)){out[out.length-1].t+=' '+l;return}out.push({t:l,done:done||/\(done\)\s*$/i.test(l)})});return out}
function powner(t){const m=t.match(/@([A-Za-z][\w.-]*(?: [A-Z][a-z]+)?)/)||t.match(/\b(?:[Oo]wner|[Aa]ssigned to|[Aa]ssignee)\s*[:\-]?\s*([A-Z][\w.-]*(?: [A-Z][a-z]+)?)/)||t.match(/\(([A-Z][a-z]+(?: [A-Z][a-z]+)?)\)\s*[.;]?$/)||t.match(/^([A-Z][a-z]+(?: [A-Z][a-z]+)?) (?:to|will|should|needs to|must) /);return m?m[1]:''}
function pdue(t){let m=t.match(/\b(\d{4}-\d{2}-\d{2})\b/);if(m)return m[1];m=t.match(/\b(?:by|due|before|until|on)\s+(?:end of\s+)?(today|tomorrow|next week|monday|tuesday|wednesday|thursday|friday|saturday|sunday|mon|tues|tue|wed|thurs|thur|thu|fri|sat|sun|\d{1,2}(?:st|nd|rd|th)?\s+[a-z]{3,9}|[a-z]{3,9}\s+\d{1,2}(?:st|nd|rd|th)?)\b/i);if(!m)return'';const s=m[1].toLowerCase(),d=new Date();d.setHours(12,0,0,0);if(s==='today')return ymd(d);if(s==='tomorrow'){d.setDate(d.getDate()+1);return ymd(d)}if(s==='next week'){d.setDate(d.getDate()+7);return ymd(d)}const wd=WD.findIndex(x=>s.startsWith(x));if(wd>=0&&!/\d/.test(s)){d.setDate(d.getDate()+((wd-d.getDay()+7)%7||7));return ymd(d)}const mo=MO.findIndex(x=>s.startsWith(x)||s.includes(' '+x)),dy=parseInt((s.match(/\d{1,2}/)||['0'])[0]);return mo>=0&&dy>0?ymd(new Date(d.getFullYear(),mo,dy,12)):''}

Feedback(){return`<div class="row"><h2>Action points</h2><span><button class="p" onclick="bulk()">Paste action points</button> <button class="s" onclick="pullForm()">Import from Outlook / Teams</button> <button class="s" onclick="autolink()">Auto-link</button> <button class="s" onclick="fbForm()">+ Add one</button></span></div><div style="margin-bottom:10px"><select style="width:auto" onchange="fbf=this.value;render()">${['All',...AS].map(o=>`<option${o===fbf?' selected':''}>${o}</option>`).join('')}</select> <select style="width:auto" onchange="fbo=this.value;render()">${['All',...new Set(S.fb.map(f=>f.owner||'Unassigned'))].map(o=>`<option${o===fbo?' selected':''}>${esc(o)}</option>`).join('')}</select></div><div class="card">${tbl(['Done','Action point','Owner','Due','Status','Priority','Theme','Source','Requirement'],
S.fb.filter(f=>(fbf==='All'||(f.status||'Open')===fbf)&&(fbo==='All'||(f.owner||'Unassigned')===fbo)).map(f=>`<tr class="c" onclick="fbForm('${f.id}')"><td onclick="event.stopPropagation()"><input type="checkbox" style="width:auto" ${f.status==='Done'?'checked':''} onchange="tgl('${f.id}')"></td><td${f.status==='Done'?' style="text-decoration:line-through;color:var(--mu)"':''}>${pj(f)}${esc(f.text)}</td><td>${esc(f.owner||'—')}</td><td>${od(f)?'<span style="color:var(--er)">'+esc(f.due)+'</span>':esc(f.due||'—')}</td><td>${pill(f.status||'Open')}</td><td>${pill(f.sev)}</td><td>${esc(f.th)}</td><td>${srcLink(f)}</td><td>${f.req?esc(nm('req',f.req,'title')):'<span class="mu">unlinked</span>'}</td></tr>`),'No action points yet. Use Paste action points.')}</div>`},
Requirements(){return`<div class="row"><h2>Requirements</h2><span><button class="s" onclick="rview='board';render()">Board</button> <button class="p" onclick="reqForm()">+ New requirement</button></span></div>`+(S.req.map(r=>`<div class="card"><div class="row" style="margin:0"><b>${pj(r)}${esc(r.title)}</b><span>${pill(r.status)} <button class="s" onclick="reqForm('${r.id}')">Edit</button></span></div>
<div class="mu">${cnt(r.id)} linked action points · release ${esc(r.rel?nm('rel',r.rel,'ver'):'unassigned')}${r.owner?' · owner '+esc(r.owner):''}</div>
<p><b>Problem:</b> ${esc(r.problem)}<br><b>Story:</b> ${esc(r.story)}<br><b>Acceptance:</b> ${esc(r.ac)}</p></div>`).join('')||'<div class="empty">No requirements yet.</div>')},
Backlog(){const L=[...S.req].sort((a,b)=>score(b)-score(a));return`<div class="row"><h2>Scored backlog</h2><span class="mu">RICE = Reach × Impact × Confidence ÷ Effort</span></div><div class="card">${tbl(['#','Requirement','Reach','Impact','Conf.','Effort','RICE','Action points','Status'],
L.map((r,i)=>`<tr class="c" onclick="reqForm('${r.id}')"><td>${i+1}</td><td>${pj(r)}${esc(r.title)}</td><td>${r.reach}</td><td>${r.impact}</td><td>${r.conf}%</td><td>${r.effort}</td><td><b>${score(r)}</b></td><td>${cnt(r.id)}</td><td>${pill(r.status)}</td></tr>`),'Nothing to prioritise yet.')}</div><div class="mu">Click a row to adjust inputs. Use the linked action point count as evidence for Reach and Confidence.</div>`},
Releases(){return`<div class="row"><h2>Release coordination</h2><button class="p" onclick="relForm()">+ New release</button></div>`+(S.rel.map(r=>{const sc=S.req.filter(q=>q.rel===r.id);return`<div class="card"><div class="row"><b>${pj(r)}${esc(r.ver)} <span class="mu">target ${r.date}</span></b><span>${pill(r.status)} <button class="s" onclick="relForm('${r.id}')">Edit</button></span></div>
<div style="margin:4px 0 8px"><button class="s" onclick="notes('${r.id}')">Release notes</button></div><div class="row" style="margin-bottom:4px"><span class="mu">Readiness</span><span>${ready(r)}%</span></div><div class="bar"><i style="width:${ready(r)}%"></i></div>
${CK.map(c=>`<label class="chk" style="margin:0;color:var(--tx);font-size:14px"><input type="checkbox" ${r.ck[c[0]]?'checked':''} onchange="tg('${r.id}','${c[0]}')">${c[1]}</label>`).join('')}
<h2 style="margin-top:12px">Scope</h2>${sc.map(q=>`<div>• ${esc(q.title)} ${pill(q.status)}</div>`).join('')||'<div class="mu">No requirements assigned. Set the release on a requirement.</div>'}
<div class="row" style="margin-top:12px"><h2 style="margin:0">Decision log</h2><button class="s" onclick="logForm('${r.id}')">+ Log decision</button></div>
${r.log.map(l=>`<div>${l.date} ${pill(l.dec)} ${esc(l.note)} <span class="mu">${esc(l.by)}</span></div>`).join('')||'<div class="mu">No decisions logged.</div>'}</div>`}).join('')||'<div class="empty">No releases yet.</div>')},
Performance(){return`<div class="row"><h2>Post-release performance</h2><button class="p" onclick="metForm()">+ New metric</button></div><div class="card">${tbl(['Metric','Release','Baseline','Target','Actual','Progress','Review'],
S.met.map(m=>`<tr class="c" onclick="metForm('${m.id}')"><td>${pj(m)}${esc(m.name)}</td><td>${m.rel?esc(nm('rel',m.rel,'ver')):'—'}</td><td>${m.base}</td><td>${m.target}</td><td>${m.act}</td><td style="min-width:120px"><div class="bar"><i style="width:${prog(m)}%;background:${prog(m)>=100?'var(--ok)':'var(--ac)'}"></i></div><span class="mu">${prog(m)}%</span></td><td>${m.date}</td></tr>`),'No metrics yet.')}</div>`}};
function render(){document.getElementById('nav').innerHTML=projBar()+TABS.map(t=>`<button class="${t===tab?'on':''}" onclick="tab='${t}';render()">${t==='Feedback'?'Action points':t}</button>`).join('')+`<span class="mu" style="margin-left:auto;align-self:center;white-space:nowrap">${DB?'Shared data':'Local only'}</span>`;const ld=DB&&!CO.every(c=>got[c]),emp=DB&&!ld&&CO.slice(0,4).every(c=>!S[c].length);document.getElementById('v').innerHTML=(ld?'<div class="card mu">Loading shared data…</div>':'')+(emp?ban():'')+view()}
function exp(){const m=document.getElementById('modal');m.innerHTML=`<form><h2>Export</h2><label>Copy this JSON to back up your data</label><textarea style="min-height:200px">${esc(JSON.stringify(S))}</textarea><div class="acts"><button type="button" class="p" id="cx">Close</button></div></form>`;m.style.display='flex';m.querySelector('#cx').onclick=()=>m.style.display='none'}
function imp(){form('Import',[{k:'j',l:'Paste exported JSON (replaces current data)',t:'area'}],{},o=>{try{const d=JSON.parse(o.j);if(d.fb&&d.req&&d.rel&&d.met){S=d;fix()}else toast('Not a valid export')}catch(e){toast('Invalid JSON')}})}
function rst(){const b=document.getElementById('rb');if(b.dataset.c){S=seed();fix();save();render();b.textContent='Reset';delete b.dataset.c}else{b.dataset.c=1;b.textContent='Confirm reset?'}}
render();
</script></body></html>
